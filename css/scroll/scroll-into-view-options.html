<html style="background: rgb(228, 228, 228);">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        button {
            padding: 0;
        }

        .container {
            border: 3px #5144bb solid;
        }

        .box {
            position: relative;
            box-sizing: border-box;
            width: 20px;
            height: 20px;
            border: 1px #555 solid;
            background: #aaa;
        }
    </style>
</head>

<body>
    <div id="con" class="container" tabindex="0" style="width:600px; height:200px; overflow-y: scroll;">
        <button class="box" style="top: 70px; left: 200px;"></button>
        <button id="btn" class="box" style="top: 300px; left: 200px; background-color: blue;"></button>
        <button class="box" style="top: 550px; left: 200px; background-color: red;"></button>
    </div>
    <script>
        function testStart() {
            var btn = document.getElementById("btn");
            screenShot("scrollIntoViewOptions_1.png", function () {
                testImgDiff("scrollIntoViewOptions_1.png", "scrollIntoViewOptions_1_expected.png");
                btn.scrollIntoView({
                    block: "start",
                    inline: "nearest"
                })
                screenShot("scrollIntoViewOptions_2.png", function () {
                    testImgDiff("scrollIntoViewOptions_2.png", "scrollIntoViewOptions_2_expected.png");
                    btn.scrollIntoView({
                        block: "center",
                        inline: "nearest"
                    })
                    screenShot("scrollIntoViewOptions_3.png", function () {
                        testImgDiff("scrollIntoViewOptions_3.png",
                            "scrollIntoViewOptions_3_expected.png");
                            btn.scrollIntoView({
                                block: "end",
                                inline: "nearest"
                            })
                        screenShot("scrollIntoViewOptions_4.png", function () {
                            testImgDiff("scrollIntoViewOptions_4.png",
                            "scrollIntoViewOptions_4_expected.png");
                            testEnd();

                        });
                    });
                });
            });
        }
    </script>
</body>
