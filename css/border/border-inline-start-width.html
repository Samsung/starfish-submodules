<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        div {
            width: 300px;
            height: 300px;
            color: green;
        }

        .test1 {
            background-color: yellow;
            height: 100px;

            border: 1px solid blue;
            border-inline-start-width: 10px;
        }

        .test2 {
            background-color: yellow;
            direction: rtl;
            height: 100px;

            border: 1px solid blue;
            border-inline-start-width: 10px;
        }

        .test3 {
            background-color: yellow;
            height: 100px;

            border: 1px solid green;
            border-inline-start-width: 5px;
            border-left-width: 100px;
            border-inline-start-width: 10px;
        }


        .test4 {
            background-color: yellow;
            height: 100px;
            direction: rtl;

            border-inline-start-width: 5px;
            border-right: 100px solid blue;
            border-inline-start-width: 10px;

        }
    </style>
</head>

<body>
    <div>
        <p class="test1"></p>
        <p class="test2"></p>
        <p class="test3"></p>
        <p class="test4"></p>
    </div>
    <script>
        function testStart() {
            screenShot("border-inline-start-width.png", function () {
                testImgDiff("border-inline-start-width.png", "border-inline-start-width_expected.png");
                testEnd();
            });
        }
    </script>
</body>

</html>
