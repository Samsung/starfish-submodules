<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        div {
            width: 300px;
            height: 300px;
            color: green;
        }

        .test1 {
            background-color: yellow;
            height: 100px;

            border: 10px double blue;
            border-inline-end-style: solid;
        }

        .test2 {
            background-color: yellow;
            direction: rtl;
            height: 100px;

            border: 10px double blue;
            border-inline-end-style: solid;
        }

        .test3 {
            background-color: yellow;
            height: 100px;

            border: 10px double green;
            border-inline-end-style: solid;
            border-right-style: double;
            border-inline-end-style: solid;
        }

        .test4 {
            background-color: yellow;
            height: 100px;
            direction: rtl;

            border-inline-end-style: solid;
            border-left: 10px double blue;
            border-inline-end-style: solid;

        }
    </style>
</head>

<body>
    <div>
        <p class="test1"></p>
        <p class="test2"></p>
        <p class="test3"></p>
        <p class="test4"></p>
    </div>
    <script>
        function testStart() {
            screenShot("border-inline-end-style.png", function () {
                testImgDiff("border-inline-end-style.png", "border-inline-end-style_expected.png");
                testEnd();
            });
        }
    </script>
</body>

</html>
