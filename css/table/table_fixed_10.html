<!DOCTYPE html>

<html>
<head>
<meta name="pixel-test">
<style>
  * {
      font-family: ahem;
  }
  .blue {
      border-style: solid;
      border-color: blue;
  }
  .red {
      border-style: solid;
      border-color: red;
  }
  .green {
      border-style: solid;
      border-color: green;
  }
  .black {
      border-style: solid;
      border-color: black;
  }
  td {
      border-width: 20px;
  }
  #c1 {
      padding: 50px;
  }
  table {
      background-color: yellow;
      border-width: 10px;
      padding: 20px;
      margin: 30px;
      table-layout: fixed;
  }
  .rgroup {
      display: table-row-group;
      border: 30px solid red;
  }
  .captionTop {
      caption-side: top;
  }
  .captionBottom {
      caption-side: bottom;
  }
  .special {
      border-style: solid;
      border-width: 40px;
      border-color: green;
  }
  </style>
</head>
<body class="green">

<div>table width: not specified; cell(1,2) has a specified width in pixel.</div>
<table class="blue">
  <tr>
    <td class="black">cell11 cell12</td>
    <td class="black">cell12</td>
    <td class="black">cell13</td>
  </tr>
  <tr>
    <td class="black" style="width: 300px">cell11 cell12</td>
    <td class="black">cell12 cell22</td>
    <td class="black">cell13 cell33</td>
  </tr>
</table>

</body>

<script>
function testStart() {
    screenShot("table_fixed_10.png", function () {
      testImgDiff("table_fixed_10.png", "table_fixed_10_expected.png");
      testEnd();
    });
  }
</script>

</html>
