<!DOCTYPE html>

<html>
<head>
<meta name="pixel-test">
<style>
  * {
      font-family: ahem;
  }
  .blue {
      border-style: solid;
      border-color: blue;
  }
  .red {
      border-style: solid;
      border-color: red;
  }
  .green {
      border-style: solid;
      border-color: green;
  }
  .black {
      border-style: solid;
      border-color: black;
  }
  td {
      border-width: 20px;
  }
  table {
      background-color: yellow;
      border-width: 10px;
      padding: 20px;
      margin: 30px;
      table-layout: fixed;
  }
  .rgroup {
      display: table-row-group;
      border: 30px solid red;
  }
  .captionTop {
      caption-side: top;
  }
  .captionBottom {
      caption-side: bottom;
  }
  .special {
      border-style: solid;
      border-width: 40px;
      border-color: green;
  }
  </style>
</head>
<body class="green">

<div>table width: not specified; cell1: auto width; cell2,3:
  specified width in pixel.</div>
<table class="blue">
    <caption class="red captionBottom">Caption: bottom</caption>
  <thead>
    <tr>
      <td class="black">word word</td>
      <td class="black" style="width:200px">word word word word</td>
      <td class="black" style="width:200px">word word word word word word word word</td>
    </tr>
  </thead>
  <tr>
    <td class="black">cell11</td>
    <td class="black">cell12</td>
    <td class="black">cell13</td>
  </tr>
  <tr>
    <td class="black">cell21</td>
    <td class="black">cell22</td>
    <td class="black">cell23</td>
  </tr>
  <tfoot>
    <tr>
      <td class="black"></td>
      <td class="black">tfoot2</td>
      <td class="black">tfoot3</td>
    </tr>
  </tfoot>

  <caption class="red captionTop">
      Caption: top
  </caption>

</table>

</body>

<script>
function testStart() {
    screenShot("table_fixed_02.png", function () {
      testImgDiff("table_fixed_02.png", "table_fixed_02_expected.png");
      testEnd();
    });
  }
</script>

</html>
