<!DOCTYPE html>

<html>
<head>
<meta name="pixel-test">
<style>
  * {
      font-family: ahem;
  }
  a {
      color: blue;
      text-decoration: none;
  }
  table {
      position: fixed;
      table-layout: fixed;
      top: 0;
      width: 100%;
      height: 100%;
      text-align: center;
  }
  td {
      position: relative;
      vertical-align: middle;
  }
  .blue {
      border-style: solid;
      border-color: blue;
  }
  .red {
      border-style: solid;
      border-color: red;
  }
  .green {
      border-style: solid;
      border-color: green;
  }
  .black {
      border-style: solid;
      border-color: black;
  }
  .rgroup {
      display: table-row-group;
      border: 30px solid red;
  }
  .captionTop {
      caption-side: top;
  }
  .captionBottom {
      caption-side: bottom;
  }
  .special {
      border-style: solid;
      border-width: 40px;
      border-color: green;
  }
  </style>
</head>
<body class="green">

<div>table width: 100%. vertical-align: middle</div>
<table class="blue" style="background:transparent;">
  <td style="">
      Paragraph should be in the middle
  </td>
</table>
</body>

<script>
function testStart() {
    screenShot("table_fixed_21.png", function () {
        testImgDiff("table_fixed_21.png", "table_fixed_21_expected.png");
        testEnd();
    });
}
</script>
</html>
