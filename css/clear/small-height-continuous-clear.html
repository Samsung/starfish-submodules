<!DOCTYPE html>
<html>
<head>
    <style type="text/css">
      .outer {
        width: 300px;
        height: 50px;
        background: gray;
      }
      .clear-left {
        clear: left;
      }
      .clear-right {
        clear: right;
      }
      .left1 {
        float: left;
        width: 40px;
        height: 5px;
        background: red;
      }
      .left2 {
        float: left;
        width: 50px;
        height: 5px;
        background: blue;
      }
      .left3 {
        float: left;
        width: 60px;
        height: 5px;
        background: green;
      }
      .right1 {
        float: right;
        width: 40px;
        height: 5px;
        background: purple;
      }
      .right2 {
        float: right;
        width: 50px;
        height: 5px;
        background: pink;
      }
      .ib { 
        display: inline-block;
        width: 40px;
        height: 40px;
        background: black; 
      }
    </style>
</head>
<body>
  <div class="outer">
    <div class="left1"></div>
    <div class="left2 clear-left"></div>
    <div class="right1"></div>
    <div class="left1"></div>
    <div class="left3 clear-left"></div>
    <div class="left2"></div>
    <div class="left1"></div>
    <div class="right2 clear-right"></div>
    <div class="right1"></div>
    <div class="ib"></div>
  </div>
</body>
 <script>
  function testStart() {
    screenShot("small-height-continuous-clear.png", function () {
      testImgDiff("small-height-continuous-clear.png", "small-height-continuous-clear_expected.png");
      testEnd();
    });
  }
</script>
</html>
