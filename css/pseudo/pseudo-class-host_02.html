<!DOCTYPE html>
<html lang="en">

<head>
   <style>
        .hostClass{
        }
    </style>

</head>

<body id="body01">
    <div id="shadowRoot" class="hostClass" attrTest="true"></div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const shadowStyle = document.createElement("style");
            const shadow = shadowRoot.attachShadow({
                mode: "open"
            });

            shadowStyle.textContent = `
                :host {
                    background-color: green;
                    width: 300px; height: 300px;
                }
                body :host {
                    /* This should not apply. */
                    background-color: yellow;
                    width: 300px; height: 300px;
                }
                #shadowRoot:host {
                    /* This should not apply. */
                    background-color: blue;
                    width: 300px; height: 150px;
                }
                .hostClass:host{
                    /* This should not apply. */
                    background-color: gray;
                    width: 300px; height: 150px;
                }
                *:host {
                    /* This should not apply. */
                    background-color: red;
                    width: 300px; height: 300px;
                }
            `;
            shadow.appendChild(shadowStyle);
        });
    </script>
    <script>
        function testStart() {
            screenShot("pseudo-class-host_02.png", function () {
                testImgDiff("pseudo-class-host_02.png", "pseudo-class-host_02_expected.png");
                testEnd();
            });
        }
    </script>
</html>
