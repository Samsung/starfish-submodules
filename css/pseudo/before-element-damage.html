<script>

a.onclick = function() {

  } else {

  screenShot("before-element-damage_01.png", function () {

    a.onclick();
    screenShot("before-element-damage_02.png", function () {
      testImgDiff("before-element-damage_02.png", "before-element-damage_02_expected.png");
      a.onclick();

        testImgDiff("before-element-damage_03.png", "before-element-damage_03_expected.png");
