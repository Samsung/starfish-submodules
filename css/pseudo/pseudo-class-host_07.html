<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body id="body01">
    <div id="shadowRoot" class="shadowRoot" attrTest="true"></div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const shadowStyle = document.createElement("style");
            const shadow = shadowRoot.attachShadow({
                mode: "open"
            });

            shadowStyle.textContent = `
                :host {
                    background-color: red;
                    width: 300px; height: 300px;
                }
            `;

            shadow.appendChild(shadowStyle);
        });
    </script>
    <script>
        setTimeout(() => {
            const newStyle = document.createElement("style");;
            newStyle.textContent = `
            div {
                background-color: green;
            }
        `;
            head = document.querySelector("head");
            head.appendChild(newStyle);

            setTimeout(() => {
                screenShot("pseudo-class-host_07.png", function () {
                    testImgDiff("pseudo-class-host_07.png",
                        "pseudo-class-host_07_expected.png");
                    testEnd();
                });
            }, 1000)
        }, 1000);
    </script>

</html>
