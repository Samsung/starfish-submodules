<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        :host {
            /* This should not apply. */
            background-color: black;
            width: 300px;
            height: 150px;
        }
    </style>

</head>

<body id="body01">
    <div id="shadowRoot" attrTest="true"></div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const shadowStyle = document.createElement("style");
            const container = document.createElement("div");
            const child = document.createElement("div");
            const shadow = shadowRoot.attachShadow({
                mode: "open"
            });

            container.id = 'container';
            child.id = 'child'

            shadowStyle.textContent = `
                :host {
                    background-color: red;
                    width: 300px; height: 300px;
                }
                #shadowRoot {
                    /* This should not apply. */
                    background-color: pink;
                    width: 300px; height: 150px;
                }
                #container {
                    background-color: blue;
                    width: inherit;
                    height: inherit;

                }
                #child {
                    width: inherit;
                    height: inherit;
                    background-color: green;
                }
                #child([attrTest="true"]) {
                    border: 10px solid black;
                }
            `;

            shadow.appendChild(shadowStyle);
            container.appendChild(child);
            shadow.appendChild(container);
        });
    </script>
    <script>
        function testStart() {
            screenShot("pseudo-class-host_01.png", function () {
                testImgDiff("pseudo-class-host_01.png", "pseudo-class-host_01_expected.png");
                testEnd();
            });
        }
    </script>

</html>
