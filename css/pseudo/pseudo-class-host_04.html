<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body id="body01">
    <div id="shadowRoot" attrTest="true"></div>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const shadowStyle = document.createElement("style");
            const shadow = shadowRoot.attachShadow({
                mode: "open"
            });
            const container = document.createElement("div");
            const child = document.createElement("div");
            container.id = 'container';
            child.id = 'child';
            child.className = 'testClass';

            shadowStyle.textContent = `
                :host {
                    background-color: red;
                    width: 600px; height: 300px;
                }
                :host([attrTest="true"]) .testClass {
                    background-color: green;
                    width: 200px; height: 300px;
                }
                :host > #container {
                    background-color: blue;
                    width: 400px; height: 300px;
                }
                .testClass {
                    background-color: yellow
                }
            `;

            shadow.appendChild(shadowStyle);
            container.appendChild(child);
            shadow.appendChild(container);
        });
    </script>
    <script>
        function testStart() {
            screenShot("pseudo-class-host_04.png", function () {
                testImgDiff("pseudo-class-host_04.png", "pseudo-class-host_04_expected.png");
                testEnd();
            });
        }
    </script>

</html>
