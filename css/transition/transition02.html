<!DOCTYPE html>
<html>
<head>
<meta name="pixel-test">
<meta charset="UTF-8" />
<style>
        body {            
            height: 100%;
        }
        img {
            width: 100%;
            max-width: 200px;
            transition: max-width 1s;
        }
        img.show {
            max-width: calc(100% - 100px);
        }
</style>
</head>
<body>
    <img src="./wide-shapes.png" class="" id="main">
    <script>
        const main = document.getElementById('main');
        function testStart() {
            window.setTimeout(function() { 
                
                main.className = 'show';
                window.setTimeout(function() { 
                    screenShot("transition02_1.png", function () {
                        testImgDiff("transition02_1.png", "transition02_1_expected.png");
                    });    
                    main.className = '';

                    window.setTimeout(function() { 
                        screenShot("transition02_2.png", function () {
                            testImgDiff("transition02_2.png", "transition02_2_expected.png");
                            testEnd();
                        });                            
                    }, 1500);
                }, 2000);
            }, 1000);
        }    
    </script>
</body>
