<!DOCTYPE html>
<html>
<head>
<meta name="pixel-test">
<meta charset="UTF-8" />
<style>
        img {            
            height: 10px;
            min-height: 50px;
            transition: min-height 1s;
        }
        img.show {
            min-height: calc(25vh + 10px);
        }
</style>
</head>
<body>
    <img src="./wide-shapes.png" class="" id="main">
    <script>
        const main = document.getElementById('main');
        function testStart() {
            window.setTimeout(function() { 
                
                main.className = 'show';
                window.setTimeout(function() { 
                    screenShot("transition05_1.png", function () {
                        testImgDiff("transition05_1.png", "transition05_1_expected.png");
                    });    
                    main.className = '';

                    window.setTimeout(function() { 
                        screenShot("transition05_2.png", function () {
                            testImgDiff("transition05_2.png", "transition05_2_expected.png");
                            testEnd();
                        });                            
                    }, 1500);
                }, 2000);
            }, 1000);
        }    
    </script>
</body>
