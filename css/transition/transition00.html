<!DOCTYPE html>
<html>
<head>
<meta name="pixel-test">
<meta charset="UTF-8" />
<style>
    body {
        height: 100vh;
        margin: 0rem;
        width: 100vw;
        overflow: hidden;
    }
    main {
        background: yellow;
        position: absolute;
        width: 100vw;
        transition: all 1s;
    }
    main.hide {
        height: 0rem;
        transform: translateY(calc(100vh - 7.5rem));
        visibility: hidden;
    }
    main.show {
        height: calc(100vh - 7.5rem);
        transform: translateY(0rem);
        visibility: visible;
    }
    header {
        background: green;
        bottom: 0rem;
        height: 7.5rem;
        position: fixed;
        width: 100vw;
    }
</style>
</head>
<body>
    <main id="main" class="hide"></main>
    <header></header>
    <script>
        const main = document.getElementById('main');
        function testStart() {
            window.setTimeout(function() { 
                
                main.className = 'show';
                window.setTimeout(function() { 
                    screenShot("transition00_1.png", function () {
                        testImgDiff("transition00_1.png", "transition00_1_expected.png");
                    });    
                    main.className = 'hide';

                    window.setTimeout(function() { 
                        screenShot("transition00_2.png", function () {
                            testImgDiff("transition00_2.png", "transition00_2_expected.png");
                            testEnd();
                        });                            
                    }, 1500);
                }, 2000);
            }, 1000);
        }    
    </script>
</body>
