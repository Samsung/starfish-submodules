<!DOCTYPE html>
<html><head>
    <meta charset="utf-8">
    <title>CSS Masking: mask-image: multiple SVG masks</title>
    <link href="mailto:cku@mozilla.com" rel="author" title="CJ Ku">
    <link href="https://www.mozilla.org" rel="author" title="Mozilla">
    <link href="https://www.w3.org/TR/css-masking-1/#the-mask-image" rel="help">
    <link href="reference/mask-image-3-ref.htm" rel="match">
    <meta content="Test checks whether SVG mask as mask layer works correctly or not." name="assert">
    </head><body><svg height="0">
      <mask y="0" x="0" width="1" id="mask1" height="1">
        <rect y="0" x="0" style="stroke:none; fill: #ffffff" width="50" height="50"></rect>
      </mask>
      <mask y="0" x="0" width="1" id="mask2" height="1">
        <circle cy="50" cx="50" r="25" style="stroke:none; fill: #ffffff"></circle>
      </mask>
    </svg>
    <style type="text/css">
      div {
        background-color: purple;
        mask-image: url(#mask1), url(#mask2);
        width: 100px;
        height: 100px;
      }
    </style>

  

  
    <div></div>
    <script>
      function testStart() {
        screenShot("mask-image-3a.png", function () {
          testImgDiff("mask-image-3a.png", "mask-image-3a_expected.png");
          testEnd();
        });
      }
    </script>    

</body></html>
