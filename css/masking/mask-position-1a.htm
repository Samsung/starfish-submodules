<!DOCTYPE html>
<html><head>
    <meta charset="utf-8">
    <title>CSS Masking: mask-position: mask positioning</title>
    <link href="mailto:aschen@mozilla.com" rel="author" title="Astley Chen">
    <link href="https://www.mozilla.org" rel="author" title="Mozilla">
    <link href="https://www.w3.org/TR/css-masking-1/#the-mask-position" rel="help">
    <link href="reference/mask-position-1-ref.htm" rel="match">
    <meta content="Test checks whether positioning mask layer works correctly or not." name="assert">
    <style type="text/css">
      div {
        width: 100px;
        height: 100px;
      }

      div.outer {
        border: 1px solid black;
      }

      div.inner {
        background-color: purple;
        mask-image: url(support/50x50-opaque-blue.svg);
        mask-repeat: no-repeat;
      }

      #inner1 { mask-position: right 20% bottom 70%; }
      #inner2 { mask-position: bottom 70% right 20%; }
      #inner3 { mask-position: right 30px bottom 25px; }
      #inner4 { mask-position: bottom 25px right 30px; }
    </style>
  </head>
  <body>
    <div class="outer"><div class="inner" id="inner1"></div></div>
    <div class="outer"><div class="inner" id="inner2"></div></div>
    <div class="outer"><div class="inner" id="inner3"></div></div>
    <div class="outer"><div class="inner" id="inner4"></div></div>
  
    <script>
      function testStart() {
        screenShot("mask-position-1a.png", function () {
          testImgDiff("mask-position-1a.png", "mask-position-1a_expected.png");
          testEnd();
        });
      }
    </script>
</body></html>
