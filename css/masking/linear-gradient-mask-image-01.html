<!DOCTYPE html>
<html>

<head>
    <meta name="pixel-test">
    <style>
        #test {
            background-color: green;
            mask-image: linear-gradient(90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 1) 100%);
            -webkit-mask-image: linear-gradient(90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 1) 100%);
            width: 400px;
            height: 350px;
        }
    </style>
</head>

<body>
    <div id="test"></div>

</body>
<script>
    function testStart() {
        screenShot("linear-gradient-mask-image-01.png", function () {
            testImgDiff("linear-gradient-mask-image-01.png", "linear-gradient-mask-image-01_expected.png");
            testEnd();
        });

    }
</script>

</html>
