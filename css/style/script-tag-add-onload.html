<!DOCTYPE html>
<html>
    <head>
        <meta name="pixel-test">
    </head>
    <body>
        <span>
            span1
        </span>
    </body>
    <script type="text/javascript">
        var scriptNode = document.createElement("script");
        scriptNode.type = "text/javascript";
        scriptNode.onload = loaded;
        document.body.appendChild(scriptNode);
        scriptNode.src = "resources/script.js";

        function loaded() {
            var elem = document.createElement("div");
            elem.textContent = "onload fired!";
            document.body.appendChild(elem);
        }

        // Capture the screen
        function testStart() {
            screenShot("script-tag-add-onload.png", function() {
                testImgDiff("script-tag-add-onload.png", "script-tag-add-onload_expected.png");
                testEnd();
            });
        }
    </script>
</html>
