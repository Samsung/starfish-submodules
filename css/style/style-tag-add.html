<!DOCTYPE html>
<html>
    <head>
        <meta name="pixel-test">
    </head>
    <body>
        <span>
            This is styled dynamically via JavaScript.
        </span>
    </body>
    <script type="text/javascript">
        var styleNode = document.createElement("style");
        styleNode.type = "text/css";
        var styleText = document.createTextNode("span { color: red; }");
        styleNode.appendChild(styleText);
        document.getElementsByTagName("head")[0].appendChild(styleNode);

        // Capture the screen
        function testStart() {
            screenShot("style-tag-add.png", function() {
                testImgDiff("style-tag-add.png", "style-tag-add_expected.png");
                testEnd();
            });
        }
    </script>
</html>
