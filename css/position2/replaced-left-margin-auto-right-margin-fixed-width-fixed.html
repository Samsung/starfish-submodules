<html>
<meta name="pixel-test">
<style>
  /** {
    font-family: ahem;
  }*/

  div {
    margin-bottom: 10px;
  }

  .rtl {
    direction: rtl;
  }

  .ltr {
    direction: ltr;
  }

  .big-container {
    background: yellow;
  }

  .container {
    position: relative;
    display: inline-block;
    width: 150px;
    height: 20px;
    border: 2px solid black;
  }
  .abs {
    position: absolute;
    height: 10px;
    margin-right: 9px;
  }

  .red {
    background: red;
  }

  .blue {
    background: blue;
  }

  .green {
    background: green;
  }

  .purple {
    background: purple;
  }

  .left-fixed {
    left: 17px;
  }

  .right-fixed {
    right: 24px;
  }

  .width-fixed {
    width: 13px;
  }
</style>
<div>left auto, right auto, width fixed</div>
<div class="big-container">
  <div class="container ltr">
    <img src="orange.png" class="abs red width-fixed ltr">abs1
  </div>
  <div class="container ltr">
    <img src="orange.png" class="abs blue width-fixed rtl">abs2
  </div>
  <div class="container rtl">
    <img src="orange.png" class="abs green width-fixed ltr">abs3
  </div>
  <div class="container rtl">
    <img src="orange.png" class="abs purple width-fixed rtl">abs4
  </div>
</div>
<div>left fixed, right auto, width fixed</div>
<div class="big-container">
  <div class="container ltr">
    <img src="orange.png" class="abs red left-fixed width-fixed ltr">abs1
  </div>
  <div class="container ltr">

  </div>
  <div class="container rtl">

  </div>
  <div class="container rtl">
    <img src="orange.png" class="abs purple left-fixed width-fixed rtl">abs4
  </div>
</div>
<div>left auto, right fixed, width fixed</div>
<div class="big-container">
  <div class="container ltr">
    <img src="orange.png" class="abs red right-fixed width-fixed ltr">abs1
  </div>
  <div class="container ltr">
    <img src="orange.png" class="abs blue right-fixed width-fixed rtl">abs2
  </div>
  <div class="container rtl">
    <img src="orange.png" class="abs green right-fixed width-fixed ltr">abs3

<script>
  function testStart() {
    screenShot("replaced-left-margin-auto-right-margin-fixed-width-fixed.png", function () {
      testImgDiff("replaced-left-margin-auto-right-margin-fixed-width-fixed.png", "replaced-left-margin-auto-right-margin-fixed-width-fixed_expected.png");
      testEnd();
