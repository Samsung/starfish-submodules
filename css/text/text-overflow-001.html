<!DOCTYPE html>
<meta name="pixel-test">
<style>
p, div {
  width: 250px;
  border: 2px solid;
  padding: 0px 0px;

  white-space: nowrap;
  overflow: hidden;
}

.overflow-visible {
  white-space: initial;
}

.overflow-clip {
  text-overflow: clip;
}

.overflow-ellipsis {
  text-overflow: ellipsis;
}

.overflow-string {
  text-overflow: "[..]"; 
}
</style>
