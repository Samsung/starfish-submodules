<html>
    <body>
        <div style="text-decoration: underline">
            This text should be underlined.

            <div style="margin: 1px 2px 3px 4px; border: medium solid; padding: 6px 8px 10px 12px">
                This text should be underlined.
            </div>

            <div style="position:absolute; top: 400px; left: 400px">
                This should not be underlined.
            </div>

            <div>This should be underlined but <span style="display:inline-block">this should not<br>be underlined<br>on any line</span>.</div>
        </div>
    </body>
    <script type="text/javascript">
        // Capture the screen
        function testStart() {
            screenShot("text-decoration-propagation-002.png", function() {
                testImgDiff("text-decoration-propagation-002.png", "text-decoration-propagation-002_expected.png");
                testEnd();
            });
        }
    </script>
</html>
