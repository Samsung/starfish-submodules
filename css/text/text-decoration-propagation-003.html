<html>
    <head>
        <style>
            .high { vertical-align: 5em; }
            .invisible { color: transparent; }
        </style>
    </head>
    <body>
        <div style="text-decoration: underline;">
            underline<span class="invisible high">continued<span class="invisible high">continued</span></span><br>
            also underlined
        </div>
    </body>
    <script type="text/javascript">
        // Capture the screen
        function testStart() {
            screenShot("text-decoration-propagation-003.png", function() {
                testImgDiff("text-decoration-propagation-003.png", "text-decoration-propagation-003_expected.png");
                testEnd();
            });
        }
    </script>
</html>
