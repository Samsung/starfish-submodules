<!DOCTYPE html>
<html>
<meta name="pixel-test">
<script src="../framework.js"></script>
<style>
  .outer {
    background-color: gray;
    width: 120px;
  }

  .left {
    background-color: teal;
    float:left;
    width: auto;
    height: 100px;
  }

  .left2 {
    background-color: yellow;
    float:left;
    width: auto;
    height: 200px;
  }

  .right {
    background-color: red;
    float:right;
    width: auto;
    height: 120px;
  }

  .right2 {
    background-color: blue;
    float:right;
    width: auto;
    height: 150px;
  }

  .normal {
    background-color: purple;
    width: auto;
    height: 150px;
  }
</style>

<body>
  <div class="outer"><div class="normal">normal</div><div class="left">left</div><div class="right">right</div><div class="right2">right</div><div class="left2">left2</div></div>
</body>

<script>
  var cssKeyValues = {
    width: ["200px", "300px", "400px", "auto"]
  };

  var outerDiv = new Div("outer");
  var divs = [outerDiv];
  var bugs = [
  ];

  function init(ltr) {
    if (ltr) {
      outerDiv.changeStyle("direction", "ltr");
    } else {
      outerDiv.changeStyle("direction", "rtl");
    }
    outerDiv.changeStyle("width", "200px");
  }

  function testStart() {
    var stepper = Stepper("stepper", divs, "width", cssKeyValues.width);

    function iterate(ltr) {
      outerDiv.elems[0].offsetHeight;
      var names = name(divs, function (divs, styles) {
        styles.push("6");
        divs.forEach(function(div) {
          styles.push(div.elems[0].style.width);
        });
      });
      console.log("img : " + names.img);
      screenShot(names.img, function () {
        testImgDiff(names.img, names.expectedImg);

        if (stepper.finished()) {
          testEnd();
        } else {
          do {
            stepper.step();
            if (stepper.finished()) {
              iterate(ltr);
              return;
            }
          } while (canSkip(divs, bugs));

          iterate(ltr);
        }
      });
    }

    init(true);
    iterate(true);
  }
</script>
</html>
