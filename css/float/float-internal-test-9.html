<!DOCTYPE html>
<html>
<meta name="pixel-test">
<script src="../framework.js"></script>
<style>
  .outer {
    background-color: gray;
    width: 240px;
  }

  .left {
    background-color: teal;
    float:left;
    width: auto;
    height: 100px;
  }

  .left2 {
    background-color: yellow;
    float:left;
    width: auto;
    height: 200px;
  }

  .right {
    background-color: red;
    float:right;
    width: auto;
    height: 120px;
  }

  .right2 {
    background-color: blue;
    float:right;
    width: auto;
    height: 150px;
  }
</style>

<body>
  <div class="outer">
    outer1
    <div class="left">
      left
    </div>
    outer2
    <span>
      span1
      <div class="left2">
        left2
      </div>
      span2
      <span>
        span3
        <div class="right">
          right
        </div>
        span 4
      </span>
      <div class="right2">
        right2
      </div>
      s p an5
    </span>
    ou ter3
    <div class="right">
      right3
    </div>
    outer4
  </div>
</body>

<script>
  var cssKeyValues = {
    width: ["120px", "200px", "500px", "auto"]
  };

  var outerDiv = new Div("outer");
  var divs = [outerDiv];
  var bugs = [];

  function init(ltr) {
    if (ltr) {
      outerDiv.changeStyle("direction", "ltr");
    } else {
      outerDiv.changeStyle("direction", "rtl");
    }
    outerDiv.changeStyle("width", "120px");
  }

  function testStart() {
    var stepper = Stepper("stepper", divs, "width", cssKeyValues.width);

    function iterate(ltr) {
      outerDiv.elems[0].offsetHeight;
      var names = name(divs, function (divs, styles) {
        styles.push("9");
        divs.forEach(function(div) {
          styles.push(div.elems[0].style.width);
        });
      });
      console.log("img : " + names.img);
      screenShot(names.img, function () {
        testImgDiff(names.img, names.expectedImg);

        if (stepper.finished()) {
          testEnd();
        } else {
          do {
            stepper.step();
            if (stepper.finished()) {
              iterate(ltr);
              return;
            }
          } while (canSkip(divs, bugs));

          iterate(ltr);
        }
      });
    }

    init(true);
    iterate(true);
  }
</script>
</html>
