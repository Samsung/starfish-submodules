<!DOCTYPE html>
<html>
<meta name="pixel-test">
<script src="../framework.js"></script>
<style>
  .outer {
    background-color: gray;
    width: 120px;
  }

  .left {
    background-color: teal;
    float:left;
    width: auto;
    height: 100px;
  }

  .left2 {
    background-color: red;
    float:left;
    width: auto;
    height: 120px;
  }

  .left3 {
    background-color: blue;
    float:left;
    width: auto;
    height: 150px;
  }

  .left4 {
    background-color: yellow;
    float:left;
    width: auto;
    height: 400px;
  }
</style>

<body>
  <div class="outer">
    outer outer2
    <div class="left">
      left
    </div>
    outer3
    <div class="left">
      left2
    </div>
    <div class="left2">
      left3
    </div>
    <div class="left3">
      left4
    </div>
    <div class="left4">
      left5
    </div>
    a ddd
    <div class="left4">
      left6
    </div>
    ccccccc
    <div class="left2">
      left7
    </div>
    b
  </div>
</body>

<script>
  var cssKeyValues = {
    width: ["120px", "180px", "240px", "auto"]
  };

  var outerDiv = new Div("outer");
  var divs = [outerDiv];
  var bugs = [
    {"width": ["240px"]}
  ];

  function init(ltr) {
    if (ltr) {
      outerDiv.changeStyle("direction", "ltr");
    } else {
      outerDiv.changeStyle("direction", "rtl");
    }
    outerDiv.changeStyle("width", "120px");
  }

  function testStart() {
    var stepper = Stepper("stepper", divs, "width", cssKeyValues.width);

    function iterate(ltr) {
      outerDiv.elems[0].offsetHeight;
      var names = name(divs, function (divs, styles) {
        styles.push("1");
        divs.forEach(function(div) {
          styles.push(div.elems[0].style.width);
        });
      });
      console.log("img : " + names.img);
      screenShot(names.img, function () {
        testImgDiff(names.img, names.expectedImg);

        if (stepper.finished()) {
          testEnd();
        } else {
          do {
            stepper.step();
            if (stepper.finished()) {
              iterate(ltr);
              return;
            }
          } while (canSkip(divs, bugs));

          iterate(ltr);
        }
      });
    }

    init(true);
    iterate(true);
  }
</script>
</html>
