		' rgb(12,56.99)',
		' rgba(123,77,26,0.3)',
		' rgba(0,23,0,0.8)'
		];

var testSTR=[];

function make_testcase(){

    testSTR.push("initial");
    testSTR.push("transparent");
    // 1
    for (var i=0; i<16; i++){
	testSTR.push(valueSet[i]);
    }

    // 2, 3, 4
    for (var i=10; i<26; i++){
	var a = valueSet[(3*i)%16];
	var b = valueSet[(9*i)%16];
	var c = valueSet[(13*i+2)%16];
	testSTR.push(a+b);
	testSTR.push(b+c);
	testSTR.push(c+a);
	testSTR.push(a+b+c);
	testSTR.push(b+a+a);
	testSTR.push(c+b+a);
	testSTR.push(c+a+b+a);
	testSTR.push(b+a+b+c);
	testSTR.push(c+c+b+a);
    }

   //invalid-Case
    testSTR.push(" initial initial");
    testSTR.push(" initial initial initial");
    testSTR.push(" initial initial initial initial");
    testSTR.push(" initial initial initial initial initial");
    testSTR.push(" transparent red initial blue");
    testSTR.push(" initial #ffeeff");
}

function testStart() {
    make_testcase();
    doTest("border_color_shorthand_",mainDIV,'border-color',testSTR,0);
}

function doTest(filePrefix,element,styleName,values,current){
    if(current<values.length){
        element.style[styleName] = values[current];
        var name = filePrefix+current;
        screenShot(name+".png", function() {
            testImgDiff(name+".png", name+"_expected.png");
            var newIDX= current+1;
            doTest(filePrefix,element,styleName,testSTR,newIDX);
        });
    }else{
        testEnd();
    }
}
