var image_uri = " url("+image_data_uri+")"

// 6-notation
var valueSet1=[
//                "",
                " #ffffff",
                " #00ff00",
                " #00ffff",
                // " #aaffaa",
                // " #111111",
                " #121212",
                " "
                ];

// named-color
var valueSet2=[
                ' black',
                ' silver',
                ' gray',
                ' white',
                // ' maroon',
                // ' red',
                // ' purple',
                ' fuchsia',
                ' green',
                // ' lime',
                // ' olive',
                ' yellow',
                ' navy',
                ' blue',
                // ' teal',
                // ' aqua',
                // ' orange',
                // ' aliceblue',
                // ' antiquewhite',
                // ' aquamarine',
                // ' azure',
                // ' beige',
                // ' bisque',
                // ' blanchedalmond',
                // ' blueviolet'
                ];

// etc
var valueSet3=[
                '',
                " no-repeat ",
                " repeat ",
                " repeat-x ",
                " repeat-y "
                ];


var testSTR=[];

function make_testcase(){
    for (var i=0;i<valueSet2.length;i++){
        testSTR.push(valueSet2[i]);
    }
    for (var i=0;i<valueSet1.length;i++){
        testSTR.push(valueSet1[i]);
    }
    testSTR.push(image_uri);
    for (var i=0;i<valueSet3.length;i++){
        testSTR.push(image_uri+valueSet3[i]);
    }
    for (var i=0;i<valueSet2.length;i++){
        for(var j=0;j<valueSet3.length;j++){
            testSTR.push(valueSet2[i]+valueSet3[j]+image_uri);
        }
    }

    testSTR.push(valueSet1[2]+valueSet3[2]+valueSet3[3]);
    testSTR.push(valueSet3[1]+valueSet3[3]+valueSet1[0]);
    testSTR.push(valueSet2[2]+valueSet1[1]+valueSet3[0]);

    testSTR.push(valueSet1[2]+valueSet3[1]+valueSet3[0]+image_uri);
    testSTR.push(image_uri+valueSet1[1]+valueSet3[1]+valueSet3[3]);
    testSTR.push(valueSet1[1]+image_uri+valueSet3[1]+valueSet3[3]);

    //invalid-Case
    testSTR.push("nocolor #11111");
    testSTR.push("repeat-z #999999");
}

function testStart() {
    make_testcase();
    doTest("background_shorthand_",mainDIV,'background',testSTR,0);
}

function doTest(filePrefix,element,styleName,values,current){
    if(current<values.length){
        element.style[styleName] = values[current];
        var name = filePrefix+current;
        screenShot(name+".png", function() {
            testImgDiff(name+".png", name+"_expected.png");
            var newIDX= current+1;
            doTest(filePrefix,element,styleName,testSTR,newIDX);
        });
    }else{
        testEnd();
    }
}
