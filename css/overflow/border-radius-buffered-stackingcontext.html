<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; }
  /* Buffered ancestor with rounded corners.
     will-change: transform allocates a graphics buffer; border-radius +
     overflow:hidden must clip a descendant stacking context's absolutely
     positioned child to the rounded shape. */
  #parent {
    width: 200px;
    height: 200px;
    margin: 40px;
    background: blue;
    border-radius: 60px;
    overflow: hidden;
    will-change: transform;
  }
  /* Descendant stacking context. */
  #child {
    position: relative;
    width: 100%;
    height: 100%;
    will-change: transform;
  }
  /* Absolute overlay filling the parent.
     Without the fix the buffered ancestor's border-radius clip is not
     reapplied after resetMatrixAndClip and this overlay paints over the
     rounded corners. */
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: red;
  }
</style>
</head>
<body>
  <div id="parent">
    <div id="child">
      <div id="overlay"></div>
    </div>
  </div>
<script>
  screenShot("border-radius-buffered-stackingcontext.png", function () {
    testImgDiff("border-radius-buffered-stackingcontext.png",
                "border-radius-buffered-stackingcontext_expected.png");
    testEnd();
  });
</script>
</body>
</html>
