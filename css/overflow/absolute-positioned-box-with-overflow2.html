<!DOCTYPE html>
<html>
<head>
  <style>
    .overflow_hidden {
      overflow: hidden;
      margin-top: 62px;
      width: 200px;
      height: 300px;
      background: blue;
      border: 5px solid blue;
    }

    .relative {
      position: relative;
      width: 300px;
      height: 200px;
      background: purple;
      border: 5px solid purple;
    }

    .fixed {
      position: fixed;
      top: 0px;
      left: 0px;
      width: 500px;
      height: 500px;
      border: 5px solid red;
    }

    .absolute {
      position: absolute;
      top: 0px;
      left: 0px;
      width: 300px;
      height: 300px;
      border: 5px solid green;
    }
  </style>
</head>

<body>
  <div class="overflow_hidden">
    <div class="relative">
      <div class="fixed"></div>
      <div class="absolute"></div>
    </div>
  </div>
</body>
<script>
  function testStart() {
    screenShot("absolute-positioned-box-with-overflow2.png", function () {
      testImgDiff("absolute-positioned-box-with-overflow2.png", "absolute-positioned-box-with-overflow2_expected.png");
      testEnd();
    });
  }
</script>
</html>
