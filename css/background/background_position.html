<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        #parent {
            width: 200px;
            height: 200px;
            background-position: 100px 100px;
            background-size: 100px 100px;
            background-image: linear-gradient(#e66465, #9198e5);
            background-repeat: no-repeat;

        }

        #child {
            width: 200px;
            height: 200px;
            /* Inheriting size should not affect the y-position of the child. */
            background-size: inherit;
            background-image: linear-gradient(#e66465, #9198e5);
            background-repeat: no-repeat;
        }
    </style>
</head>

<body>
    <div id="parent">
        <div id="child"></div>
    </div>
</body>
<script>
    function testStart() {
        screenShot("background_position.png", function () {
            testImgDiff("background_position.png", "background_position_expected.png");
            testEnd();
        });

    }
</script>

</html>
