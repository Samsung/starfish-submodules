<!DOCTYPE html>
<html>

<head>
    <meta name="pixel-test">
    <style>
        div {
            border: 5px solid black;
            margin-top: 5px;
            height: 40px;
            color: green;
        }

        #test1 {
            background: linear-gradient(0deg, yellow, blue);
        }
        #test2 {
            background: linear-gradient(to top, yellow, blue);
        }
        #test3 {
            background: linear-gradient(90deg, yellow, blue);
        }
        #test4 {
            background: linear-gradient(to right, yellow, blue);
        }
        #test5 {
            background: linear-gradient(180deg, yellow, blue);
        }
        #test6 {
            background: linear-gradient(to bottom, yellow, blue);
        }
        #test7 {
            background: linear-gradient(270deg, yellow, blue);
        }
        #test8 {
            background: linear-gradient(to left, yellow, blue);
        }
    </style>
</head>

<body>
    <div id="test1"></div>
    <div id="test2"></div>
    <div id="test3"></div>
    <div id="test4"></div>
    <div id="test5"></div>
    <div id="test6"></div>
    <div id="test7"></div>
    <div id="test8"></div>
</body>
<script>
    function testStart() {
        screenShot("background_lineargradient8.png", function () {
            testImgDiff("background_lineargradient8.png", "background_lineargradient8_expected.png");
            testEnd();
        });

    }
</script>

</html>
