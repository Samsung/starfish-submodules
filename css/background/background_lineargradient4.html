<!DOCTYPE html>
<html>

<head>
    <meta name="pixel-test">
    <style>
        div {
            border: 5px solid black;
            margin-top: 5px;
            height: 100px;
            width: 100px;
            color: green;
        }

        #test1 {
            background: linear-gradient(180deg, rgba(255, 0, 0, 0.637), rgba(0,0,255,1));
        }
        #test2 {
            background: linear-gradient(rgba(255, 0, 0, 0.637), rgba(0,0,255,1));
        }    
    </style>
</head>

<body>
    <div id="test1"></div>
    <div id="test2"></div>
</body>
<script>
    function testStart() {
        screenShot("background_lineargradient4.png", function () {
            testImgDiff("background_lineargradient4.png", "background_lineargradient4_expected.png");
            testEnd();
        });

    }
</script>
</html>
