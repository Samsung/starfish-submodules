<!DOCTYPE html>
<html>

<head>
    <meta name="pixel-test">
    <style>
        div {
            border: 5px solid black;
            margin-top: 5px;
            height: 40px;
            color: green;
        }

        #test1 {
            background: linear-gradient(135deg, yellow, blue);
        }

        #test2 {
            background: linear-gradient(-45deg, blue, yellow);
        }

        #test3 {
            background: linear-gradient(yellow, blue 20%, #0f0);
        }

        #test4 {
            background: linear-gradient(to top right, red, white, blue)
        }
    </style>
</head>

<body>
    <div id="test1"></div>
    <div id="test2"></div>
    <div id="test3"></div>
    <div id="test4"></div>
</body>
<script>
    function testStart() {
        screenShot("background_lineargradient7.png", function () {
            testImgDiff("background_lineargradient7.png", "background_lineargradient7_expected.png");
            testEnd();
        });

    }
</script>

</html>
