<!DOCTYPE html>
<html>

<head>
    <meta name="pixel-test">
    <style>
        div {
            margin-top: 5px;
            height: 100px;
            width: 100px;
            border-radius: 3.6px;
            background: green;
        }

        #test1 {
            background-image: linear-gradient(rgba(0, 0, 0, 0.00) 50%, rgb(0, 0, 0));
        }

        #test2 {
            background-image: linear-gradient(rgba(0, 0, 0, 0.00) 50%, #000000);
        }

        #test3 {
            background-image: linear-gradient(-180deg, rgba(0, 0, 0, 0.00) 50%, #000000 100%);
        }

        #test4 {
            background-image: linear-gradient(180deg, rgba(0, 0, 0, 0.00) 50%, #000000 100%);
        }
    </style>
</head>

<body>
    <div id="test1"></div>
    <div id="test2"></div>
    <div id="test3"></div>
    <div id="test4"></div>
</body>
<script>
    function testStart() {
        screenShot("background_lineargradient5.png", function () {
            testImgDiff("background_lineargradient5.png", "background_lineargradient5_expected.png");
            testEnd();
        });

    }
</script>

</html>
