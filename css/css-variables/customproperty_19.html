<meta name="pixel-test">
<meta charset="utf-8" />
<style>
    * { font-family: Ahem; }
    /* In the component’s style: */
    .component .header {
        color: var(--header-color, blue);
    }
    .component .text {
        color: var(--text-color, black);
    }

    /* In the larger application’s style: */
    .component {
        --text-color: #080;
        /* header-color isn’t set,
            and so remains blue,
            the fallback value */
    }
</style>
<div class="component" id="one">
    <div class="header" id="two">HEADER</div>
    <div class="text" id="three">text text text text text text text text </div>
</div>
<script>
    function testStart() {
        screenShot("customproperty_19.png", function () {
            testImgDiff("customproperty_19.png", "customproperty_19_expected.png");
            testEnd();
        });
    }
</script>
