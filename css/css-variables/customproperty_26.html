<!DOCTYPE html>
<html>

<head>
  <meta name="pixel-test">
  <meta charset="utf-8" />
  <style>
    #panel {
      /*--gradient 가 invalid하고, 여러개의 fallback value로 이루어진 경우 */
      background-image: var(--gradient, linear-gradient(366deg, rgba(20, 116, 70, 0.6) 0%, rgba(8, 8, 8, 0) 64.88%), linear-gradient(180deg, rgb(249, 253, 0) 0%, rgba(8, 8, 8, 0) 64.88%));
      background-position: 100% 360px;
      background-size: 100% 360px;
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 360px;
    }
  </style>
</head>

<body>
  <div id="panel-container">
    <div id="panel"></div>
  </div>
</body>
<script>
  function testStart() {
      screenShot("customproperty_26.png", function () {
          testImgDiff("customproperty_26.png", "customproperty_26_expected.png");
          testEnd();
      });
  }
</script>
</html>
