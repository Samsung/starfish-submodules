<!DOCTYPE html>
<html>

<head>
  <meta name="pixel-test">
  <meta charset="utf-8" />
  <style>
    #panel {
      /* background-image의 multi-value중에서 var()가 invalid한 경우, "the guaranteed-invalid value" 로 처리 */
      background-image: var(--gradient), linear-gradient(366deg, rgba(20, 116, 70, 0.6) 0%, rgba(8, 8, 8, 0) 64.88%), linear-gradient(180deg, rgb(249, 253, 0) 0%, rgba(8, 8, 8, 0) 64.88%);
      background-position: 100% 360px;
      background-size: 100% 360px;
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 360px;
    }
  </style>
</head>

<body>
  <div id="panel-container">
    <div id="panel"></div>
  </div>
</body>
<script>
  function testStart() {
      screenShot("customproperty_27.png", function () {
          testImgDiff("customproperty_27.png", "customproperty_27_expected.png");
          testEnd();
      });
  }
</script>
</html>
