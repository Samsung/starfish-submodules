<!DOCTYPE html>
<html>
<head>
<meta name="pixel-test">
<style> 
:root {
  --degree: 45deg;
  --translate: calc(70px + 30px), calc(120px + 30px);
}
div#i1 {
  width: 300px;
  height: 100px;
  background-color: yellow;
  border: 1px solid black;
  transform: translate(var(--translate)) scale(1.2) rotate(calc(var(--degree))) skew(var(--degree));
}
</style>
</head>
<body>

<h1>CSS 2D Transforms</h1>
<p>Our arrowheads carry six or even, mostly, short, and cold lanterns.
</p>

<div id="i1">
Some old curtain on train 100 plates in red water, for 200 pillow hung over our morning platform.
</div>

</body>
