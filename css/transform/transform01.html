<!DOCTYPE html>
<html>
<head>
<meta name="pixel-test">
<style> 
div#i1 {
  width: 300px;
  height: 100px;
  font-size: 16px;
  background-color: yellow;
  border: 1px solid black;
  transform: translateY(calc(50px + 50px)) translateX(calc(50px + 50px)) translate(calc(50px + 50px), calc(20px + 20px)) rotate(calc(20deg + 70deg)) skew(calc(20deg + 20deg));
}
div#i2 {
  width: 300px;
  height: 100px;
  font-size: 16px;
  background-color: yellow;
  border: 1px solid black;
  transform: translateY(50px) translateX(200px) translate(100px, 40px) rotate(90deg) skew(40deg);
}
</style>
</head>
<body>

<h1>CSS 2D Transforms</h1>
<p>Our arrowheads carry six or even, mostly, short, and cold lanterns.
</p>

<div id="i1">
Some old curtain on train 100 plates in red water, for 100 pillow hung over our morning platform.
</div>
<div id="i2">
Some old curtain on train 200 plates in red water, for 50 pillow hung over our morning platform.
</div>

</body>
<script>
screenShot("transform01.png", function () {

    testEnd();
});
</script>
  
</html>
