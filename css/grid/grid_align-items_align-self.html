<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .gridContainer {
            position: relative;
            display: grid;
            align-items: stretch;
            grid-template: "a b c d" / max-content max-content max-content;
            background-color: gold;
            width: fit-content;
            height: 300px;
        }

        .gridItem1 {
            position: relative;
            width: 200px;
            grid-area: a;
            align-self: start;
            background-color: red;
        }

        .gridItem2 {
            position: relative;
            width: 200px;
            grid-area: b;
            align-self: end;
            background-color: green;
        }

        .gridItem3 {
            position: relative;
            width: 200px;
            grid-area: c;
            align-self: center;
            background-color: blue;
        }

        .gridItem4 {
            position: relative;
            width: 200px;
            grid-area: d;
            background-color: purple;
        }
    </style>
</head>

<body>
    <div class="gridContainer">
        <div class="gridItem1">
            <div style="width: 100px; height: 50px; "></div>
        </div>
        <div class="gridItem2">
            <div style="width: 100px; height: 50px; "></div>
        </div>
        <div class="gridItem3">
            <div style="width: 100px; height: 50px; "></div>
        </div>
        <div class="gridItem4">
        </div>
    </div>
</body>
<script>
    function testStart() {
        screenShot("grid_align-items_align-self.png", function () {
            testImgDiff("grid_align-items_align-self.png", "grid_align-items_align-self_expected.png");
            testEnd();
        });
    }
</script>

</html>
