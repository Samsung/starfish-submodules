<!doctype html>
<html>
<meta name="pixel-test">
<head>
  <style>
body {
  margin: 40px;
}

.wrapper {
  display: inline-grid;
  grid-template-columns:1fr 1fr;
  grid-column-gap: 8px;
  border: solid 3px;
}

.box {
  background-color: #777;
  font-size: 150%;
}

.a {
  grid-column-start:2;
  grid-column-end:4;
}

.b {
  grid-column-start:1;
  grid-column-end:3;
}
  </style>
</head>
<body style="font-family: StarfishAhem">
<div id="c" class="wrapper">
  <div id="tt" class="box">AB</div>
  <div class="box a">A</div>
  <div class="box b" style="width:100px; background-color:orange">B</div>
  <div class="box" style="background-color:green;">H</div>
  <div class="box" style="background-color:green;">TT</div>
  <div class="box" style="background-color:green;">:)</div>
</div>
</body>
<script>
  function testStart() {
    screenShot("gridbox_simple-box-21.png", function() {
      testImgDiff("gridbox_simple-box-21.png", "gridbox_simple-box-21_expected.png");
      testEnd();
    });
  }
</script>
</html>
