<!doctype html>
<html>
<meta name="pixel-test">
<head>
  <style>
.wrapper {
  display: inline-grid;
  grid-template-columns: 1fr 100px;
  grid-template-rows: 1fr 100px 1fr;
  border:solid 10px;
  color: #000;
}

.box {
  background-color: #000;
  color: #fff;
  font-size: 150%;
}
  </style>
</head>
<body style="font-family: Ahem">
<div class="wrapper">
  <div class="box a" style="background-color:green;">A</div>
  <div class="box b" style="background-color:blue; width:400px">B</div>
  <div class="box c" style="background-color:red;">C</div>
  <div class="box d" style="background-color:orange;">D</div>
  <div class="box e" style="background-color:teal;">E</div>
  <div class="box f" style="background-color:yellowgreen; height:100px">F</div>
  <div class="box g" style="background-color:yellowgreen;">G</div>
</div>
</body>
<script>
  function testStart() {
    screenShot("gridbox_simple-box-7.png", function() {
      testImgDiff("gridbox_simple-box-7.png", "gridbox_simple-box-7_expected.png");
      testEnd();
    });
  }
</script>
</html>
