<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .gridContainer {
            display: grid;
            width: 500px;
            height: 300px;
            grid-template: 150px 1fr / 100px 1fr;
        }

        .item1 {
            background-color: yellow;
        }

        .item2 {
            background-color: red;
        }

        .item3 {
            background-color: green;
        }

        .item4 {
            background-color: blue;
        }
    </style>
</head>

<body>
    <div id="target" class="gridContainer">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
    </div>

</body>
<script>
    function testStart() {
        screenShot("grid-template_01.png", function () {
            testImgDiff("grid-template_01.png", "grid-template_01_expected.png");
            testEnd();
        });
    }
</script>

</html>
