<!doctype html>
<html>

<head>
    <meta name="pixel-test">
    <style>
        * {
            font-family: Ahem;
        }

        .wrapper {
            display: grid;
            grid-template-columns: auto auto;
            /* grid-gap: 10px; */
            background-color: #2196F3;
            padding: 10px;
            width: 700px;
            height: 500px;
        }

        .wrapper>div {
            color: #d9480f;
        }

        .box1 {
            background-color: red;
            height: 50px;
        }

        .box2 {
            background-color: blue;
            height: 50px;
        }

        .box3 {
            grid-column-start: span 3;
            background-color: yellow;
            height: 50px;
        }

        .box4 {
            background-color: purple;
            height: 50px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </div>
</body>
<script>
    function testStart() {
        screenShot("gridbox_span_06.png", function() {
            testImgDiff("gridbox_span_06.png", "gridbox_span_06_expected.png");
            testEnd();
        });
    }
</script>

</html>
