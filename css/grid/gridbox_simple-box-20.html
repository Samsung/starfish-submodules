<!doctype html>
<html>
<meta name="pixel-test">
<head>
  <style>
body {
  margin: 40px;
}

.wrapper {
  display: inline-grid;
  grid-template-columns: 100px 1fr;
  grid-template-rows: 100px 100px;
  background-color: #fff;
  border: solid 3px;
}

.box {
  background-color: #777;
  color: #fff;
  font-size: 150%;
}

.b {
  grid-row-start:3;
  grid-row-end:5;
  height:100px;
}
  </style>
</head>
<body style="font-family: StarfishAhem">
  <div class="wrapper">
  <div class="box a">A-1</div>
  <div class="box a">A-2</div>
  <div class="box a">A-3</div>
  <div class="box a">A-4</div>
  <div class="box b">B</div>
  <div class="box f" style="background-color:orange">F</div>
  <div class="box t" style="width:500px">B</div>
  </div>
</body>
<script>
  function testStart() {
    screenShot("gridbox_simple-box-20.png", function() {
      testImgDiff("gridbox_simple-box-20.png", "gridbox_simple-box-20_expected.png");
      testEnd();
    });
  }
</script>
</html>
