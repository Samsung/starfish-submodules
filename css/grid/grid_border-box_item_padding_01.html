<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .gridParent {
            width: 400px;
            display: grid;
            grid-template: 1fr;

            align-items: center;
            box-sizing: border-box;
        }

        .flexContainer {
            background-color: yellow;
            position: relative;

            padding: 50px 25px;
            
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        
        .flexItem1{
            width: 350px;
            height: 50px;
            background-color: red;
        }
        .flexItem2{
            width: 350px;
            height: 50px;
            background-color: green;
        }

        .nonGridParent {
            width: 400px;
            background-color: red;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="gridParent">
        <div class="flexContainer">
            <div class="flexItem1"></div>
            <div class="flexItem2">
            </div>
        </div>
    </div>
    <div class="nonGridParent">
        <div class="flexContainer">
            <div class="flexItem1"></div>
            <div class="flexItem2">
            </div>
        </div>
    </div>
</body>
<script>
    function testStart() {
        screenShot("grid_border-box_item_padding_01.png", function () {
            testImgDiff("grid_border-box_item_padding_01.png", "grid_border-box_item_padding_01.png");
            testEnd();
        });
    }
</script>
</html>
