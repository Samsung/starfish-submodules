<!doctype html>
<html>

<head>
  <meta name="pixel-test">
  <style>
    * {
      font-family: Ahem;
    }

    .gridBox {
      display: grid;
    }

    .webkitBox {
      text-align: center;
      margin: 25px;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      box-sizing: border-box;
      background-color: blue;
    }

    .flexBox {
      text-align: center;
      margin: 25px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background-color: yellow;
    }

    .flexBoxWidthoutMargin {
      text-align: center;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      background-color: green;
    }

    .blockbox {
      margin: 25px;
      text-align: center;
      box-sizing: border-box;
      background-color: cyan;
    }
  </style>
</head>

<body>
  <div class="gridBox">
    <div class="webkitBox">"Download a file"</div>
    <div class="flexBox">"Download a file"</div>
    <div class="flexBoxWidthoutMargin">"Download a file"</div>
    <div class="blockbox">"Download a file"</div>
  </div>
  <br>
  <br>
  <div>
    <div class="webkitBox">"Download a file"</div>
    <div class="flexBox">"Download a file"</div>
    <div class="flexBoxWidthoutMargin">"Download a file"</div>
    <div class="blockbox">"Download a file"</div>
  </div>
</body>
<script>
  function testStart() {
    screenShot("gridbox_child_flexbox_with_margin.png", function () {
      testImgDiff("gridbox_child_flexbox_with_margin.png", "gridbox_child_flexbox_with_margin_expected.png");
      testEnd();
    });
  }
</script>

</html>
