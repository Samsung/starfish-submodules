<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .gridContainer {
            position: relative;
            display: grid;
            grid-template-rows: auto;
            grid-template-columns: max-content max-content;
            grid-template-areas: "a b";
        }

        .gridItem1 {
            position: relative;
            width: 100px;
            height: 50%;
            grid-area: a;
            background-color: blue;
        }

        .gridItem2 {
            position: relative;
            width: 100px;
            height: 100%;
            grid-area: b;
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div class="gridContainer">
        <div class="gridItem1 ">
            <div style="width: 50px; height: 50%; background-color: red;"></div>
        </div>
        <div class="gridItem2 ">
            <div style="width: 100px; height: 50px; background-color: green;"></div>
        </div>
    </div>
</body>
<script>
    function testStart() {
        screenShot("grid-template-rows_auto_grid-item_height_percent_02.png", function () {
            testImgDiff("grid-template-rows_auto_grid-item_height_percent_02.png", "grid-template-rows_auto_grid-item_height_percent_02_expected.png");
            testEnd();
        });
    }
</script>

</html>
