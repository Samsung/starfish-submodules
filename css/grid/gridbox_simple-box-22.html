<!doctype html>
<html>
<meta name="pixel-test">
 <head>
  <style>
    .wrapper {
      position: absolute;
      left: 100px;
      display: grid;
      grid-template-columns: 1fr 100px 100px 1fr;
      border: 2px solid #f76707;
      border-radius: 5px;
      background-color: #fff4e6;
      width: 150px;
    }

    .wrapper div {
      border: 2px solid #ffa94d;
      border-radius: 5px;
      background-color: #ffd8a8;
      padding: 1em;
      color: #d9480f;
    }

  </style>
 </head>
 <body style="font-family: Ahem;">
  <div class="wrapper">
    <div>OneOneOne</div>
    <div>Two</div>
    <div>Three</div>
    <div>Four</div>
    <div>Five</div>
  </div>
 </body>
 <script>
  function testStart() {
    screenShot("gridbox_simple-box-22.png", function() {
      testImgDiff("gridbox_simple-box-22.png", "gridbox_simple-box-22_expected.png");
      testEnd();
    });
  }
 </script>
</html>
