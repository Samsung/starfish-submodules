<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="pixel-test">
        <title>Grid with positioned layers</title>
        <style>
* {font-family: Ahem;}
.app {display: grid;
                border: 2px solid red;
                grid-template-columns: 80px 1fr;
                position: relative;}
.layer {pointer-events: none;}
.layer-bottom {background-color: transparent;
                bottom: 0;
                height: 100vh;
                /*position: absolute;*/}
.layer-full {height: 100vh;
                left: 0;
                position: absolute;
                top: 0;
                width: 100vw;}
body {margin: 0;}
.strip {background: linear-gradient(180deg,transparent,#000 300px,#000);
                border: 2px solid blue;
                bottom: 0;
                height: 380px;
                left: 0;
                margin: 0;
                position: fixed;
                right: 0;
                width: 100%;
                z-index: 5;}
.strip-bar {background-color: #214cfb;
                bottom: 0;
                height: 6px;
                margin-bottom: 28px;
                position: absolute;
                width: 100%;}
</style>
    </head>

    <body style="background: transparent;">
        
        <div id="root" role="application">
            <div class="app">
                

                

                



                <div id="bottom-layer" class="layer layer-bottom" style="z-index: 100;">
                    <div id="strip" class="strip">
                        <div id="strip-bar" class="strip-bar"></div>
                    </div>
                </div>
                <div id="full-layer" class="layer layer-full" style="z-index: 200;"></div>
            </div>
        </div>
    </body>

<script>
    function testStart() {
        screenShot("gridbox_example_02.png", function() {
            testImgDiff("gridbox_example_02.png", "gridbox_example_02_expected.png");
            testEnd();
        });
    }
</script>

</html>
