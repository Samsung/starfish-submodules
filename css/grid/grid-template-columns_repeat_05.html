<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .grid-container {
            --col-gap: 14px;
            display: grid;
            width: 500px;
            grid-template-columns: repeat(auto-fit, calc((100% - var(--col-gap) * 3) / 4));
            column-gap: var(--col-gap);
            background-color: blue;
        }
        .item{
            background-color: lime;
            height: 60px;
        }
    </style>
</head>

<body>
    <div class="grid-container">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
    <script>
        function testStart() {
            screenShot("grid-template-columns_repeat_05.png", function () {
                testImgDiff("grid-template-columns_repeat_05.png", "grid-template-columns_repeat_05_expected.png");
                testEnd();
            });
        }
    </script>
</body>

</html>
