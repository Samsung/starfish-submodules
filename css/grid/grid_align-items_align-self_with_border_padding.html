<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .gridContainer {
            position: relative;
            display: grid;
            align-items: stretch;
            grid-template: "a b c d" / max-content max-content max-content max-content;
            background-color: gold;
            width: 600px;
            height: 300px;

        }

        .gridItem1 {
            position: relative;
            width: 100px;
            grid-area: a;
            align-self: start;
            padding: 10px;
            border: 10px solid black;
            background-color: red;
        }

        .gridItem2 {
            position: relative;
            width: 100px;
            grid-area: b;
            align-self: end;
            padding: 10px;
            border: 10px solid black;
            background-color: green;
        }

        .gridItem3 {
            position: relative;
            width: 100px;
            grid-area: c;
            align-self: center;
            padding: 10px;
            border: 10px solid black;

            background-color: blue;
        }

        .gridItem4 {
            position: relative;
            width: 100px;
            grid-area: d;
            padding: 10px;
            border: 10px solid black;
            background-color: purple;
        }
    </style>
</head>

<body>
    <div class="gridContainer">
        <div class="gridItem1">
            <div style="height: 50px;"></div>
        </div>
        <div class="gridItem2">
            <div style="height: 50px;"></div>
        </div>
        <div class="gridItem3">
            <div style="height: 50px;"></div>
        </div>
        <div class="gridItem4">
        </div>
    </div>
</body>
<script>
    function testStart() {
        screenShot("grid_align-items_align-self_with_border_padding.png", function () {
            testImgDiff("grid_align-items_align-self_with_border_padding.png", "grid_align-items_align-self_with_border_padding_expected.png");
            testEnd();
        });
    }
</script>

</html>
