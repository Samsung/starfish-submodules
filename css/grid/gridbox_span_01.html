<!doctype html>
<html>
<head>
<meta name="pixel-test">
<style>
* {
  font-family: Ahem;
}
.wrapper {
  //width: 120px;
  display: grid;
  //grid-template-columns: min-content min-content max-content;
  //grid-template-columns: min-content max-content min-content;
  grid-template-columns: min-content auto 1fr;

  grid-gap: 10px;
  border: 2px solid #f76707;
  border-radius: 5px;
  background-color: #fff4e6;
}

.wrapper > div {
  border: 2px solid #ffa94d;
  border-radius: 5px;
  background-color: #ffd8a8;
  padding: 1em;
  color: #d9480f;
}

.box1 {
  grid-row: 1;
  //grid-row-start: 1;
  //grid-row-end: 2;
  //grid-column-start: 4;
  //grid-column-end: 2;
}
.box2 {
  grid-row: 1;
  //grid-row-start: 1;
  //grid-row-end: 2;
  grid-column-start: 2;
  grid-column-end: 4;
}
.box3 {
  grid-row: 2;
  //grid-row-start: 1;
  //grid-row-end: 2;
  //grid-column-start: 3;
  //grid-column-end: 4;
}

.box4 {
  grid-row: 2;
  //grid-row-start: 1;
  //grid-row-end: 2;
  grid-column-start: 2;
  grid-column-end: 3;
}


</style>
</head>
<body>
  <div class="wrapper">
    <div class="box1">1</div>
    <div class="box2">22 22 22</div>

    <div class="box3">333</div>
    <div class="box4">4444 4444</div>
    <!--
    <div class="box5">55555</div>
    <div class="box4">4444</div>
    <div class="box3">333</div>
    <div class="box2">22</div>
    <div class="box1">1</div>
    -->
  </div>
</body>
<script>
function testStart() {
  screenShot("gridbox_span_01.png", function() {
    testImgDiff("gridbox_span_01.png", "gridbox_span_01_expected.png");
    testEnd();
  });
}
</script>
</html>
