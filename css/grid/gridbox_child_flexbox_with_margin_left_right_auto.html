<!doctype html>
<html>

<head>
  <meta name="pixel-test">
  <style>
    * {
      font-family: Ahem;
    }

    .grid {
      display: grid;
      background-color: yellow;
    }

    .flex_auto {
      display: flex;
      margin: auto;
      background-color: blue;
    }

    .flex_left_auto {
      display: flex;
      margin: 0 auto 0 0;
      background-color: blue;
    }

    .flex_right_auto {
      display: flex;
      margin: 0 0 0 auto;
      background-color: blue;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div class="flex_auto">
      xxxxxx
    </div>
    <div class="flex_left_auto">
        xxxxxx
    </div>
    <div class="flex_right_auto">
        xxxxxx
    </div>
  </div>
</body>
<script>
    function testStart() {
      screenShot("gridbox_child_flexbox_with_margin_left_right_auto.png", function () {
        testImgDiff("gridbox_child_flexbox_with_margin_left_right_auto.png", "gridbox_child_flexbox_with_margin_left_right_auto_expected.png");
        testEnd();
      });
    }
  </script>  

</html>
