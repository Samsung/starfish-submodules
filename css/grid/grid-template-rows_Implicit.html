<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .gridContainer {
            display: grid;
            width: 500px;
            height: 300px;
            grid-template-columns: 100px 1fr;
            grid-template-areas:
                "item1 item2"
                "item3 item3"
                "item4 item4";

        }

        .item1 {
            background-color: yellow;
            grid-area: item1;
        }

        .item2 {
            background-color: red;
            grid-area: item2;
        }

        .item3 {
            background-color: green;
            grid-area: item3;
        }

        .item4 {
            background-color: blue;
            grid-area: item4;
        }
    </style>
</head>

<body>
    <div id="target" class="gridContainer">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
    </div>
</body>
<script>
    function testStart() {
        screenShot("grid-template-rows_Implicit.png", function () {
            testImgDiff("grid-template-rows_Implicit.png", "grid-template-rows_Implicit_expected.png");
            testEnd();
        });
    }
</script>

</html>
