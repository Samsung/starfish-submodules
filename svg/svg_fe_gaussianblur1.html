<style>

</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <filter id="blurMe1" filterUnits="userSpaceOnUse">
    <feGaussianBlur stdDeviation="10" edgeMode="duplicate" />
  </filter>
  <filter id="blurMe2" filterUnits="userSpaceOnUse">
    <feGaussianBlur stdDeviation="1 20" edgeMode="wrap"/>
  </filter>
  <filter id="blurMe3" filterUnits="userSpaceOnUse">
    <feGaussianBlur stdDeviation="20 1" />
  </filter>
  <filter id="blurMe4" filterUnits="userSpaceOnUse">
    <feGaussianBlur stdDeviation="10" edgeMode="none"/>
  </filter>

  <circle cx="100" cy="100" r="50" fill="green" />
  <circle cx="300" cy="100" r="50" fill="green" filter="url(#blurMe1)" />
  <circle cx="100" cy="250" r="50" fill="green" filter="url(#blurMe2)" />
  <circle cx="300" cy="250" r="50" fill="green" filter="url(#blurMe3)" />
  <circle cx="100" cy="400" r="50" fill="green" filter="url(#blurMe4)" />
</svg>

            testEnd();
