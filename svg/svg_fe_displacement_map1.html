<!DOCTYPE html>
<html><head>
<style>
* { margin: 0px }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Filter 1: feTurbulence + feDisplacementMap with default parameters -->
    <filter id="displace1">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="1" result="turbulence1" seed="1"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence1" scale="10"/>
    </filter>

    <!-- Filter 2: feTurbulence (fractalNoise) + feDisplacementMap with higher scale -->
    <filter id="displace2">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="turbulence2" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence2" scale="30"/>
    </filter>

    <!-- Filter 3: feTurbulence with higher baseFrequency + feDisplacementMap using G channel -->
    <filter id="displace3">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="1" result="turbulence3" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="turbulence3" scale="20" xChannelSelector="G" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Original circle -->
  <circle cx="100" cy="100" r="50" fill="green" />

  <!-- Circle with displacement filter 1 -->
  <circle cx="300" cy="100" r="50" fill="green" filter="url(#displace1)" />

  <!-- Circle with displacement filter 2 -->
  <circle cx="100" cy="300" r="50" fill="green" filter="url(#displace2)" />

  <!-- Circle with displacement filter 3 -->
  <circle cx="300" cy="300" r="50" fill="green" filter="url(#displace3)" />

</svg>
<script>
    function testStart() {
        screenShot("svg_fe_displacement_map1.png", function () {
            testImgDiff("svg_fe_displacement_map1.png", "svg_fe_displacement_map1_expected.png");
            testEnd();
        });
    }
</script>
</body>
