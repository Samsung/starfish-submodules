<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        canvas {
            display: block;
            background-color: green;
            margin-top: 10px;
        }
    </style>
    <script type="application/javascript">
        // Test passes if there is a no blue pixel
        function draw() {
            var canvas = document.getElementById("canvas");
            if (canvas.getContext) {
                var ctx = canvas.getContext("2d");
                ctx.beginPath();
                ctx.moveTo(50, 50);
                ctx.lineTo(250, 50);
                ctx.lineTo(250, 150);
                ctx.lineTo(50, 150);
                ctx.closePath();
                ctx.moveTo(70, 70);
                ctx.lineTo(230, 70);
                ctx.lineTo(230, 130);
                ctx.lineTo(70, 130);
                ctx.closePath();
                ctx.stroke();
            }
        }
    </script>
</head>

<body onload="draw();">
    <canvas id="canvas" width="300px" height="200px">canvas</canvas>
</body>
<script>
    function testStart() {
        screenShot("basicStrokePath.png", function () {
            testImgDiff("basicStrokePath.png", "basicStrokePath_expected.png");
            testEnd();
        });
    }
</script>
</html>
