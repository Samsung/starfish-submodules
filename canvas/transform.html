<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        canvas {
            border: 1px solid black;
            margin: 10px;
            padding: 3px;
        }
    </style>
    <script type="application/javascript">
        function draw() {
            var ctx = document.getElementById('canvas').getContext('2d');

            ctx.beginPath();
            ctx.moveTo(0, 50);
            ctx.lineTo(50, 50);
            
            ctx.save();
            ctx.transform(1, 0, 0, 1, 20, 10);

            ctx.moveTo(0, 50);
            ctx.lineTo(50, 50);
            
            ctx.save();
            ctx.transform(1, 0, 0, 1, 20, 10);
            
            ctx.moveTo(0, 50);
            ctx.lineTo(50, 50);

            ctx.restore();
            
            ctx.moveTo(0, 100);
            ctx.lineTo(50, 100);
            
            ctx.restore();
            ctx.moveTo(0, 100);
            ctx.lineTo(50, 100);
            
            ctx.stroke();   
        }
    </script>
</head>

<body onload="draw();">
    <canvas id="canvas" width="300px" height="200px">canvas</canvas>
</body>
<script>
    function testStart() {
        screenShot("transform.png", function () {
            testImgDiff("transform.png", "transform_expected.png");
            testEnd();
        });
    }
</script>
</html>
