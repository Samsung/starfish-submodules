<!DOCTYPE html>
<html lang="en">
<meta name="pixel-test">

<head>
    <style>
        canvas {
            padding: 100px;
            display: block;
            margin: 10px;
            border: 10px solid black;
            background-color: blue;
        }
    </style>
    <script type="application/javascript">
        function draw() {
            var canvas = document.getElementById("canvas");
            if (canvas.getContext) {
                var ctx = canvas.getContext("2d");
                ctx.fillRect(0, 0, 300, 200);
            }
        }
    </script>
</head>

<body onload="draw();">
    <canvas id="canvas" width="300px" height="200px">canvas</canvas>
</body>
<script>
    function testStart() {
        screenShot("borderPadding.png", function () {
            testImgDiff("borderPadding.png", "borderPadding_expected.png");
            testEnd();
        });
    }
</script>

</html>
