<!DOCTYPE html>
<html>
<meta name="pixel-test">
<script src="../css/framework.js"></script>
<style>
  .outer {
    background-color: gray;
    position: absolute;
    width: 500px;
    height: 400px;
  }

  .inner {
    background-color: pink;
    width: 100px;
    height: 100px;
    top: 30px;
    left: 30px;
  }

  .inner2 {
    background-color: teal;
    width: 100px;
    height: 100px;
    top: 20px;
    left: 20px;
  }

  .inner3 {
    background-color: mediumpurple;
    width: 100px;
    height: 100px;
    top: 30px;
    left: 30px;
  }

  .inner4 {
    background-color: royalblue;
    width: 100px;
    height: 100px;
    top: 20px;
    left: 20px;
  }
</style>

<body>
  <div class="outer">
    <div class="inner">
        inner1
    </div>
    <div class="inner2">
        inner2
        <div class="inner3">
          inner3
        </div>
    </div>
    <div class="inner4">
        inner4
    </div>
  </div>
</body>

<script>
  var cssKeyValues = {
    "position": ["static", "absolute"],
    "z-index": ["-5", "-3", "0", "auto", "3", "5"],
  };

  function getColor(color) {
    if (color.substr(0, 4) == "rgba") {
      var re = /rgba\((\d+), (\d+), (\d+), (\d+)\)/;
      var c = color.match(re);
    } else {
      var re = /rgb\((\d+), (\d+), (\d+)\)/;
      var c = color.match(re);
    }

    return c.map(function (v) { return parseInt(v); });
  }

  function compose(color) {
    return "rgb(" + color[1] + ", "  + color[2] + ", " + color[3] + ")";
  }

  function onClick(e) {
    var color = window.getComputedStyle(this, null).getPropertyValue("background-color");
    var colorValue = getColor(color);
    colorValue[1] += 37;
    colorValue[2] += 29;
    colorValue[3] += 16;
    if (colorValue[1] >= 255) {
      colorValue[1] = 138;
    }
    if (colorValue[2] >= 255) {
      colorValue[2] = 169;
    }
    if (colorValue[3] >= 255) {
      colorValue[3] = 253;
    }
    this.style.backgroundColor = compose(colorValue);
  }

  function onClickOnCapture(e) {
    var color = window.getComputedStyle(this, null).getPropertyValue("background-color");
    var colorValue = getColor(color);
    colorValue[1] -= 23;
    colorValue[2] -= 52;
    colorValue[3] -= 31;
    if (colorValue[1] <= 0) {
      colorValue[1] = 128;
    }
    if (colorValue[2] <= 0) {
      colorValue[2] = 150;
    }
    if (colorValue[3] <= 0) {
      colorValue[3] = 164;
    }
    this.style.backgroundColor = compose(colorValue);
    e.stopPropagation();
  }

  function onClickOnBubble(e) {
    var color = window.getComputedStyle(this, null).getPropertyValue("background-color");
    var colorValue = getColor(color);
    colorValue[1] *= 1.2;
    colorValue[2] *= 1.3;
    colorValue[3] *= 1.1;
    if (colorValue[1] >= 255) {
      colorValue[1] = 27;
    }
    if (colorValue[2] >= 255) {
      colorValue[2] = 89;
    }
    if (colorValue[3] >= 255) {
      colorValue[3] = 75;
    }
    this.style.backgroundColor = compose(colorValue);
  }

  var outerDiv = new Div("outer", "onclick", onClick);
  var innerDiv = new Div("inner", "onclick", onClick);
  var inner2Div = new Div("inner2", "onclick", onClick);
  var inner3Div = new Div("inner3", "onclick", onClick);
  var inner4Div = new Div("inner4", "onclick", onClick);
  var divs = [inner3Div, inner4Div];
  var divsToClock = [outerDiv, innerDiv, inner2Div, inner3Div, inner4Div];
  var bugs = [
              ];
  var duplicates = [
                    /* static, but with z-index */
                    {"position": ["static"], "z-index": ["!auto"]},
                    {"position": ["*", "static"], "z-index": ["*", "!auto"]},
                    /* three same values */
                    {"z-index": ["auto", "auto"]},
                   ];

  for (var i in divsToClock) {
    divsToClock[i].elems[0].onclick = onClick;
    divsToClock[i].elems[0].addEventListener("click", onClickOnBubble, false);
    divsToClock[i].elems[0].addEventListener("click", onClickOnCapture, true);
  }

  function init() {
    innerDiv.changeStyle("position", "static");
    inner2Div.changeStyle("position", "static");
    inner3Div.changeStyle("position", "static");
    inner4Div.changeStyle("position", "static");

    innerDiv.changeStyle("z-index", "auto");
    inner2Div.changeStyle("z-index", "auto");
    inner3Div.changeStyle("z-index", "auto");
    inner4Div.changeStyle("z-index", "auto");
  }

  function testStart() {
    var stepper2 = Stepper("stepper2", divs, "position", cssKeyValues.position);
    var stepper = Stepper("stepper", divs, "z-index", cssKeyValues["z-index"], stepper2);

    function iterate() {
      var names = name(divs, function (divs, styles) {
        styles.push(innerDiv.elems[0].style.position);
        styles.push(innerDiv.elems[0].style["z-index"]);
        styles.push(inner2Div.elems[0].style.position);
        styles.push(inner2Div.elems[0].style["z-index"]);

        divs.forEach(function(div) {
          styles.push(div.elems[0].style.position);
          styles.push(div.elems[0].style["z-index"]);
        });
      });

      function screenShotForDivs(i) {
        if (i < divsToClock.length) {
          var newBaseName = "click-propagation-with-stop-" + names.baseName + "-click-on-" + divsToClock[i].name;
          var newImgName = newBaseName + ".png";
          var newExpectedImgName = newBaseName + "_expected.png";
          console.log("name : " + newImgName);
          var rect = getXYWH(divsToClock[i].elems[0]);
          simulateClick(rect.x + 10, rect.y + 10);
          screenShot(newImgName, function () {
            testImgDiff(newImgName, newExpectedImgName);
            screenShotForDivs(i + 1);
          });
        } else {
          if (stepper.finished()) {
            testEnd();
          } else {
            do {
              stepper.step();
              if (stepper.finished()) {
                testEnd();
              }
            } while (canSkip(divs, bugs) || canSkip(divs, duplicates));

            iterate();
          }
        }
      }

      screenShotForDivs(0);
    }

    init()
    iterate();
  }
</script>
</html>
